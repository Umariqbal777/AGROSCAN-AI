{% extends 'layout.html' %}{% block content %}
<div class="py-6">
  <div class="text-center mb-10 fade-up fade-up-1">
    <h1 class="text-4xl font-black mb-2" style="font-family:'Playfair Display',serif">{{ _('Meet the Team') }}</h1>
    <p class="sage-text max-w-lg mx-auto">{{ project_summary }}</p>
  </div>

  <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-5 fade-up fade-up-2">
    {% for member in team_members %}
    <div class="card p-6 text-center group">
      <div class="w-20 h-20 rounded-full mx-auto mb-4 flex items-center justify-center text-4xl" style="background:rgba(45,106,53,0.15);border:2px solid rgba(45,106,53,0.3)">
        {{ member.emoji }}
      </div>
      <h3 class="font-bold text-lg" style="font-family:'Playfair Display',serif">{{ member.name }}</h3>
      <p class="gold-text text-xs font-semibold uppercase tracking-wider mt-1 mb-2">{{ member.role }}</p>
      <p class="sage-text text-sm">{{ member.contributions }}</p>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
